[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "panelaugment"
version = "0.2.0"
description = "Donor-aware conditional augmentation of fixed gene panels"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]
keywords = ["gene-panel", "feature-selection", "spatial-transcriptomics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
sparse = ["scipy>=1.10,<2"]
h5ad = ["scipy>=1.10,<2", "anndata>=0.10,<1"]
dev = ["pytest>=8,<10", "build>=1,<2", "wheel"]

[project.scripts]
panelaugment = "panelaugment.cli:main"

[project.urls]
Repository = "https://github.com/zhailongjie/panelaugment"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
panelaugment = ["resources/base_panels/*.json", "resources/base_panels/*.csv", "resources/base_panels/genes/*.tsv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
