name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[dev]'
      - run: python -m pytest
      - run: panelaugment demo --out demo-output
      - run: python -m build
  optional-io:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev,h5ad]'
      - run: python -m pytest
      - name: Run the real MERFISH selection example
        run: |
          panelaugment preprocess --input examples/merfish/data/training-counts.npz --library-totals examples/merfish/data/library-totals.npy --all-training --mandatory-base-id BP-11010522 --measurement-counts examples/merfish/data/measurement-counts.npz --out merfish-preprocessed
          panelaugment select --input merfish-preprocessed/training.npz --normalized --base-id BP-11010522 --n-added 10 --ridge 1 --out merfish-selection
          python examples/merfish/check_output.py merfish-selection/panels.json
